 o.forEach((s,k)=>$('#o'+k).onclick=async()=>{if(s==t){if(!miss)rec(t,true);star();fb('¡Sí!','ok');await wait(700);if(my===T)d(!miss)}else{const b=$('#o'+k);b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),300);if(!miss){miss=true;rec(t,false)}fb('Escucha otra vez','no')}})}
function itemText(t,d,sk){if(chk())return;const t0=Date.now();let rm='',ms=false;
 draw(BACK+`<div class="stage"><div class="txt">${t.x}</div><div class="row"><button class="btn alt" id="h">🔊 Ayuda</button><button class="btn" id="n">Ya lo leí ➜</button></div></div>`);
 $('#h').onclick=()=>say('t:'+String(t.i).padStart(3,'0'),t.x,.75);if(!sk)inst('t','Lee el texto. Cuando termines, pulsa Ya lo leí.');$('#n').onclick=()=>{if(!sk)rm=rdRec(t,Math.max(1,Math.round((Date.now()-t0)/1000)));ask()};
 function ask(){const o=shuf(t.o);
  const my=draw(BACK+`<div class="stage"><p class="fb" style="margin:0">${t.q}</p><div class="row"><button class="btn" id="h">🔊 Escuchar pregunta</button><button class="btn alt" id="bk">📖 Ver texto</button></div><div class="grid" style="grid-template-columns:repeat(${o.length},1fr);margin-top:14px">${o.map((e,k)=>`<button class="k" id="o${k}" style="font-size:3rem">${e}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`);
  const hear=()=>say('q:'+String(t.i).padStart(3,'0'),t.q,.85);$('#h').onclick=hear;hear();$('#bk').onclick=()=>itemText(t,d,1);
  o.forEach((e,k)=>$('#o'+k).onclick=async()=>{if(e==t.o[0]){star();fb('¡Muy bien!'+(rm?' '+rm:''),'ok');await wait(rm?2200:800);if(my===T)d(!ms)}else{const b=$('#o'+k);b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),300);ms=true;fb('Vuelve a leer el texto','no')}})}}
function itemRead(w,pic,d){if(chk())return;const U=units(w);let t=0;const TM=pr().rm=='t'||!(window.SpeechRecognition||window.webkitSpeechRecognition);
 const my=draw(BACK+`<div class="stage"><div class="word">${U.map((c,i)=>`<span class="l${sil(U,i)?' mu':''}" id="l${i}">${c}</span>`).join('')}</div><div class="row"><button class="btn alt" id="hear">🔊 Escuchar sonidos</button>${TM?'<button class="btn" id="ok2">✔ Lo leyó bien</button><button class="btn alt" id="ko2">Necesita ayuda</button>':'<button class="btn rec" id="mic">🎤 Leo yo</button>'}</div><div class="fb" id="fb">Escucha y luego di la palabra.</div><div class="row" id="nx"></div></div>`);
 const nxt=ok=>{wrec(w,ok);$('#nx').innerHTML='<button class="btn" id="n">Siguiente ➜</button>';$('#n').onclick=()=>d(ok)};
 const blend=async()=>{for(let i=0;i<U.length;i++){const e=$('#l'+i);if(my!==T||!e)return;if(sil(U,i))continue;const e2=sil(U,i+1)?$('#l'+(i+1)):null;e.classList.add('on');if(e2)e2.classList.add('on');await snd(U[i]);await wait(120);e.classList.remove('on');if(e2)e2.classList.remove('on')}if(my===T)await wd(w)};
 $('#hear').onclick=blend;inst('r','Lee la palabra en voz alta. Si quieres, escucha primero los sonidos.');
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(TM){fb('Lee en voz alta. El tutor valida si lo ha leído bien.');
  $('#ok2').onclick=async()=>{star();fb('¡Muy bien! '+w,'ok');await wd(w);if(my===T)nxt(t<2)};
  $('#ko2').onclick=async()=>{t++;if(t<2){fb('Vamos otra vez. Escucha los sonidos 💪','no');await blend();fb('Ahora tú.')}else{fb('Vamos juntos: '+w,'no');await blend();if(my===T)nxt(false)}}}
 else $('#mic').onclick=()=>{
  if(!SR){fb('Este navegador no escucha. El tutor decide:');$('#nx').innerHTML='<button class="btn" id="y">Lo dijo bien ✔</button><button class="btn alt" id="h2">Necesita ayuda</button>';$('#y').onclick=()=>{star();fb('¡Muy bien!','ok');nxt(true)};$('#h2').onclick=()=>{blend();nxt(false)};return}
  const r=new SR();r.lang='es-ES';r.maxAlternatives=5;try{speechSynthesis.cancel()}catch(e){}fb('Te escucho… 👂');
  r.onresult=async e=>{if(my!==T)return;const a=[...e.results[0]].flatMap(x=>norm(x.transcript).split(' '));
   if(a.includes(norm(w))){star();fb('¡Muy bien! '+w,'ok');await wd(w);if(my===T)nxt(t<2)}
   else{t++;if(t<3){fb('Casi. Escucha y prueba otra vez 💪','no');await blend();fb('Ahora tú.')}else{fb('Vamos juntos: '+w,'no');await blend();if(my===T)nxt(false)}}};
  const pv=r.onresult;r.onresult=e=>{r._g=1;pv(e)};r.onend=()=>{if(!r._g&&!r._e)fb('No oí nada. Pulsa el micrófono y prueba otra vez.','no')};r.onerror=e=>{r._e=1;const M={'not-allowed':'El micrófono está bloqueado. Revisa el permiso del sitio en Chrome (candado junto a la dirección).','service-not-allowed':'Chrome no permite el reconocimiento de voz en esta página.','audio-capture':'No encuentro ningún micrófono.','network':'El reconocimiento de voz de Chrome necesita internet.','no-speech':'No te oí. Prueba otra vez, un poco más cerca.'};fb(M[e.error]||'Error del micrófono: '+e.error,'no');if(e.error=='not-allowed'||e.error=='service-not-allowed'||e.error=='audio-capture'){$('#nx').innerHTML='<button class="btn" id="y">Lo dijo bien ✔</button><button class="btn alt" id="h2">Necesita ayuda</button>';$('#y').onclick=()=>{star();fb('¡Muy bien!','ok');nxt(true)};$('#h2').onclick=()=>{blend();nxt(false)}}};
  try{r.start()}catch(e){fb('No puedo iniciar el micrófono: '+e.message,'no')}}}

function itemBuild(w,pic,d){if(chk())return;const U=units(w),known=ORDER.slice(0,pr().lv+1);let pos=0,bad=false,ab=false;
 const pool=shuf([...U,...shuf(known.filter(x=>!U.includes(x))).slice(0,2)]);
 const my=draw(BACK+`<div class="stage"><div class="pic">${pic||''}</div><div class="word">${U.map((c,i)=>`<span class="slot" id="s${i}"></span>`).join('')}</div><div class="grid" style="grid-template-columns:repeat(${Math.min(pool.length,5)},1fr)">${pool.map((c,i)=>`<button class="k" id="k${i}">${c}</button>`).join('')}</div><div class="row"><button class="btn alt" id="hear">🔊 Escuchar palabra</button></div><div class="fb" id="fb"></div><div class="row" id="nx"></div></div>`);
 $('#hear').onclick=()=>wd(w);inst('b','Escucha la palabra y ordena las letras para formarla.').then(()=>{if(my===T)wd(w)});
 pool.forEach((c,i)=>$('#k'+i).onclick=async()=>{if(pos>=U.length)return;const b=$('#k'+i);
  if(c===U[pos]){$('#s'+pos).textContent=c;if(!bad)rec(c,true);bad=false;pos++;b.disabled=true;if(!sil(U,pos-1))snd(c);
   if(pos===U.length){star();fb('¡Lo lograste! '+w,'ok');await wait(900);if(my!==T)return;await wd(w);if(my!==T)return;$('#nx').innerHTML='<button class="btn" id="n">Siguiente ➜</button>';$('#n').onclick=()=>d(!ab)}}
  else{b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),300);if(!bad){bad=true;ab=true;rec(U[pos],false)}fb('¡Casi! Prueba con otra letra 💪','no')}})}

function practice(){const p=pr(),wi=LV.findIndex(l=>l.w.length),si=LV.findIndex(l=>l.s.length),hasS=sylsTo(p.lv).length>0,hasW=LV.slice(0,p.lv+1).some(l=>l.w.length),tf=m=>TX.filter(t=>m=='f'?t.n==1:t.n>1),okT=m=>tf(m).some(t=>t.l<=p.lv),nd=m=>Math.min(...tf(m).map(t=>t.l)),okR=TX.some(t=>t.l<=p.lv&&(p.rd||{})[t.x]);
 const o=(ok,m,i,t,s,need)=>`<button class="big in" ${ok?`onclick="pl('${m}')"`:'disabled style="opacity:.55"'}><i>${ok?i:'🔒'}</i><div><b>${t}</b><span>${ok?s:need==null?'Lee antes una frase o lectura':'Se desbloquea con la '+cap(LV[need].g)}</span></div></button>`;
 draw(BACK+`<div class="menu">${o(1,'c','👂','Letras','Escucha y elige la letra')}${o(1,'w','✏️','Trazar letras','Repasa con el dedo')}${o(hasS,'s','🔡','Sílabas','Escucha, elige y construye',si)}${o(hasW,'b','🧩','Construye palabras','Ordena las letras',wi)}${o(hasW,'r','🗣️','Lee palabras','Dilas en voz alta',wi)}${o(okT('f'),'f','💬','Frases','Lee y elige la imagen',nd('f'))}${o(okT('t'),'t','📘','Lecturas','Textos cortos con preguntas',nd('t'))}${o(okR,'x','🔁','Releer','Lee otra vez y mejora tu velocidad',null)}${o(hfAv(p).length>0,'h','🔠','Palabras frecuentes','Las palabras que más se leen',Math.min(...HFL.map(x=>x.l)))}</div><p class="fb">Solo con lo que ya sabes.</p>`)}
function pl(m){const p=pr(),pool=LV.slice(0,p.lv+1).flatMap(l=>l.w);
 const nx=()=>{if(m=='h'){const A=hfAv(pr()).sort((a,b)=>((pr().hf||{})[a.w]||0)-((pr().hf||{})[b.w]||0)||Math.random()-.5),w=A[0].w;itemRead(w,'',ok=>{hfRec(w,ok);nx()})}else if(m=='w'){const K=ORDER.slice(0,pr().lv+1),z=pr().tz||'M';itemTrace(K[rand(K.length)],nx,z=='2'?rand(2)==1:z=='m')}else if(m=='x'){const R=pr().rd||{},L=TX.filter(t=>t.l<=pr().lv&&R[t.x]).sort((a,b)=>(R[a.x].d==key())-(R[b.x].d==key())||R[a.x].n-R[b.x].n||Math.random()-.5);itemText(L[0],nx)}else if(m=='f'||m=='t'){const L=TX.filter(t=>(m=='f'?t.n==1:t.n>1)&&t.l<=pr().lv),c=L.filter(t=>t!==lastX),t=c.length?c[rand(c.length)]:L[0];lastX=t;itemText(t,nx)}else if(m=='s'){const A=sylsTo(pr().lv);Math.random()<.65?itemSylChoose(A,A,nx):itemBuild(A[rand(A.length)],'',nx)}else if(m=='c')itemChoose(pr().lv,nx);else{const wt=pool.map(x=>units(x[0]).reduce((a,u)=>a+(stat(u).d<=Date.now()?6-stat(u).b:0),1));let r=Math.random()*wt.reduce((a,b)=>a+b,0),k=0;while((r-=wt[k])>0)k++;const [w,pic]=pool[k];m=='r'?itemRead(w,pic,nx):itemBuild(w,pic,nx)}};nx()}

try{if('serviceWorker' in navigator)addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(()=>setTimeout(()=>ORDER.forEach(u=>fetch('audio/letras/'+fn(u)+'.wav').catch(()=>{})),4000)).catch(()=>{})})}catch(e){}
setTheme(th);$('#th').onclick=()=>setTheme(document.documentElement.dataset.theme=='dark'?'light':'dark');if(pr())home();else profiles();
</script>
